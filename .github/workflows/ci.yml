name: CI

# Builds and tests. The downloadable packages are built by packages.yml, and only when a pull
# request touches something that can break them; a release rebuilds everything from scratch anyway.
#
# A change to nothing but Markdown cannot break the build, so it does not start one. That matters
# most for edits made on GitHub straight to main, which would otherwise start two Windows jobs.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04 rather than latest: a self-contained build links against the build machine's glibc, and
    # 24.04 would produce binaries that refuse to start on Debian 12 or Ubuntu 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags, or it versions everything 0.0.0.

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The portrait model is not in git; with it present the tests run it rather than only its fallback.
      - name: Fetch the subject model that is not in git
        run: scripts/models/fetch.sh

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Linux packages are the only builds compiled without the bundled ImageMagick, and the package
      # jobs no longer run for every change. This compiles that configuration on its own, so code
      # that uses BundledImageMagick outside #if BUNDLED_IMAGEMAGICK fails here in seconds. It runs
      # after the tests because it restores the app without Magick.NET.
      - name: Build as Linux packages do, without the bundled ImageMagick
        run: dotnet build src/Composa.App --configuration Release -p:BundleImageMagick=false

      # Screenshots are how a UI regression is inspected without a display, so they are worth
      # keeping when something failed.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

  # The same suite on Windows, headless UI tests included. Composa is developed on Linux, so this is
  # the only place a path separator, a line ending or a platform folder is tested the other way round.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags, or it versions everything 0.0.0.

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch the subject model that is not in git
        shell: bash
        run: scripts/models/fetch.sh

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: artifacts/screenshots/
          if-no-files-found: ignore
